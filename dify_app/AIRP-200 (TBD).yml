app:
  description: Sample Dify App (AIRP-200) for Dify2API
  icon: alien
  icon_background: '#D1E9FF'
  icon_type: emoji
  mode: workflow
  name: AIRP-200 (TBD)
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
