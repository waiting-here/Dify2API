<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>Dify2API</title>
<link rel="stylesheet" href="/static/pico.min.css">
<style>
  /* ============================================================
     「清爽 SaaS」纯 CSS 换肤层（v1.3.2 M1）
     设计令牌集中在 :root / [data-theme=dark]，覆盖对应 --pico-* 变量；
     不改 DOM 结构、不改 JS、不改 Pico 文件本身。
     结构规则（.table-wrap 横滑、.row-actions、.tab-nav flex、媒体查询）
     保持原有职责，皮肤层只覆盖视觉并补增量修复（R1/R2/R3）。
     ============================================================ */

  /* ---------------- 设计令牌（浅色为默认） ---------------- */
  :root {
    /* 品牌主色：清爽蓝（Stripe 系），含 hover/focus 派生 */
    --brand: #2563eb;
    --brand-hover: #1d4ed8;
    --brand-soft: #eff4ff;          /* 主色浅底（选中态/强调背景） */
    --brand-border: #c7d8fb;

    /* 中性阶（背景 / 卡片 / 边框 / 文字） */
    --bg: #f4f6fb;                  /* 页面背景：微冷灰，衬出白卡 */
    --surface: #ffffff;             /* 卡片/面板 */
    --surface-2: #f8fafc;           /* 次级填充（表头/输入框底） */
    --border: #e6eaf2;              /* 默认边框：更柔 */
    --border-strong: #d4dbe8;
    --text: #1f2937;
    --text-muted: #6b7280;

    /* 状态色（徽章/提示，柔和低饱和） */
    --ok-bg: #e7f7ee;    --ok-fg: #15803d;
    --warn-bg: #fdf4e0;  --warn-fg: #b45309;
    --err-bg: #fdeaea;   --err-fg: #c03636;
    --info-bg: #e9f1fe;  --info-fg: #1d4ed8;
    --off-bg: #eef1f6;   --off-fg: #64748b;

    /* 形状与层次 */
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-md: 0 4px 16px -4px rgba(16, 24, 40, .08), 0 2px 6px -2px rgba(16, 24, 40, .05);
    --shadow-lg: 0 12px 32px -8px rgba(16, 24, 40, .16);

    /* 字体：层级靠字重与字号，不引入新字体 */
    --font: var(--pico-font-family-sans-serif);

    /* 覆盖 Pico 变量，让框架组件跟随主题 */
    --pico-font-family: var(--font);
    /* 页面底色由 <html> 承载；光晕的透明边缘落回同一 --bg，避免长页面露出浏览器画布。 */
    --pico-background-color: var(--bg);
    --pico-color: var(--text);
    --pico-muted-color: var(--text-muted);
    --pico-muted-border-color: var(--border);
    --pico-border-radius: var(--radius);
    --pico-card-background-color: var(--surface);
    --pico-card-border-color: var(--border);
    --pico-card-box-shadow: var(--shadow-sm);
    --pico-primary: var(--brand);
    --pico-primary-background: var(--brand);
    --pico-primary-border: var(--brand);
    --pico-primary-hover-background: var(--brand-hover);
    --pico-primary-hover-border: var(--brand-hover);
    --pico-primary-focus: rgba(37, 99, 235, .28);
    --pico-primary-inverse: #fff;
    --pico-form-element-background-color: var(--surface);
    --pico-form-element-border-color: var(--border-strong);
    --pico-form-element-focus-color: var(--brand);
  }

  /* ---------------- 深色主题（同一套令牌换值） ---------------- */
  /* Pico 的暗色有两条等效路径，本层令牌必须同时覆盖（auto=null 时走
     prefers-color-scheme 媒体查询，其 :root:not([data-theme]) 优先级 0-1-1 高于
     :root，且 Pico 后声明——不加此规则则 auto 模式下会拿到 Pico 默认色）：
       1) 声明式：[data-theme=dark]（用户显式选深色）
       2) 媒体查询：@media (prefers-color-scheme: dark) 且根元素无 data-theme（auto）*/
  [data-theme="dark"] {
    --brand: #5b8cff;
    --brand-hover: #7ba2ff;
    --brand-soft: #1a2540;
    --brand-border: #2c3d63;

    --bg: #0f1420;
    --surface: #171d2e;
    --surface-2: #1d2438;
    --border: #262f47;
    --border-strong: #333e5e;
    --text: #e6eaf2;
    --text-muted: #93a0b8;

    --ok-bg: #123324;    --ok-fg: #4ade80;
    --warn-bg: #352a12;  --warn-fg: #fbbf24;
    --err-bg: #3a1a1a;   --err-fg: #f87171;
    --info-bg: #16233f;  --info-fg: #7ba2ff;
    --off-bg: #232a3d;   --off-fg: #93a0b8;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-md: 0 4px 16px -4px rgba(0, 0, 0, .5);
    --shadow-lg: 0 12px 32px -8px rgba(0, 0, 0, .6);
    --pico-background-color: var(--bg);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --brand: #5b8cff;
      --brand-hover: #7ba2ff;
      --brand-soft: #1a2540;
      --brand-border: #2c3d63;

      --bg: #0f1420;
      --surface: #171d2e;
      --surface-2: #1d2438;
      --border: #262f47;
      --border-strong: #333e5e;
      --text: #e6eaf2;
      --text-muted: #93a0b8;

      --ok-bg: #123324;    --ok-fg: #4ade80;
      --warn-bg: #352a12;  --warn-fg: #fbbf24;
      --err-bg: #3a1a1a;   --err-fg: #f87171;
      --info-bg: #16233f;  --info-fg: #7ba2ff;
      --off-bg: #232a3d;   --off-fg: #93a0b8;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-md: 0 4px 16px -4px rgba(0, 0, 0, .5);
      --shadow-lg: 0 12px 32px -8px rgba(0, 0, 0, .6);
      --pico-background-color: var(--bg);
    }
  }

  /* ---------------- 全局基底（顶部品牌光晕 + 抗锯齿） ---------------- */
  /* 光晕画在始终铺满页面的 <html>；透明边缘回落到 --bg，长短页面都不会露出画布。 */
  html {
    background-color: var(--bg);
    background-image:
      radial-gradient(1200px 600px at 70% -10%, rgba(37, 99, 235, .06), transparent 60%);
  }
  html[data-theme="dark"] {
    background-image:
      radial-gradient(1200px 600px at 70% -10%, rgba(91, 140, 255, .10), transparent 60%);
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) {
      background-image:
        radial-gradient(1200px 600px at 70% -10%, rgba(91, 140, 255, .10), transparent 60%);
    }
  }
  body {
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

/* ---------------- 顶部导航：毛玻璃 + 细分隔线 ---------------- */
  body > nav { border-bottom: 1px solid var(--border); padding: .65rem 1.25rem; display: flex; justify-content: space-between; align-items: center;
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: saturate(1.4) blur(8px);
    box-shadow: var(--shadow-sm);
  }
  body > nav .logo { font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; color: var(--brand); }
  /* W1c: 主容器流式铺满——不再固定 1440px 上限，始终占满可用宽度；
     左右留白用 clamp(1rem, 2vw, 2rem) 自适应（两站共享同一份样式）。
     宽表格仍只在 .table-wrap 内局部横滑，不撑破页面。 */
  main.container { max-width: none; width: 100%; padding-inline: clamp(1rem, 2vw, 2rem); }
  /* ---------------- 卡片：柔和投影 + 大圆角 + 悬停浮起 ---------------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 1.5rem 1.5rem; margin-bottom: 1.25rem; transition: box-shadow .18s ease, transform .18s ease; }
  .card:hover { box-shadow: var(--shadow-md); }
  .card h3 { margin-top: 0; margin-bottom: .6rem; font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
  /* Tables scroll horizontally inside their card instead of overflowing it. */
  .card .table-wrap { overflow-x: auto; }
  .card .table-wrap > table { margin-bottom: 0; }
  /* 表格单元格通用策略（V-ACCEPT 表格通用优化）：
     - 默认 nowrap，保持时间/ID/积分等短列紧凑；
     - .wrap 列负责长文本：必须同时给 min-width 下限，否则表格 auto
       布局会把宽列挤成「一字一行」的细条（错误详情列/等级列曾中招）；
     - .wrap 一律 overflow-wrap:anywhere，长 URL/JSON/模型串无空格也能断行；
     - 等级/状态等徽章列用 .wrap-badges：上限收窄，避免吃掉邻居列空间。 */
  table td, table th { white-space: nowrap; }
  table td.wrap, table th.wrap { white-space: normal; overflow-wrap: anywhere; min-width: 9rem; }
  table td.wrap-badges { white-space: normal; overflow-wrap: anywhere; min-width: 9rem; max-width: 22rem; }
  div.wrap { white-space: normal; overflow-wrap: anywhere; }
  /* 超长单元格：截断预览 + 就地展开（方案 A+C）。
     - .cell-clamp 用弹性上限（rem，随视口缩放，不写死像素），line-clamp 限制行数，
       保证列宽/行高稳定、表格不被单条长内容顶宽；表格仍只在 .table-wrap 局部横滑。
     - 需要看全文时展开同级 <details>，比 title 悬浮更适配移动端（无悬浮）。 */
  .cell-clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
    white-space: normal; overflow-wrap: anywhere; min-width: 9rem; max-width: clamp(16rem, 32vw, 30rem); line-height: 1.4; }
  /* 展开态：取消行数截断，但限制最大高度、内部纵向滚动看全文，避免单条超长内容把整行拉成刷屏高度 */
  .cell-clamp.cell-open { -webkit-line-clamp: unset; display: block; overflow-y: auto; overflow-x: hidden;
    max-height: 14rem; padding-right: .35rem; }
  .cell-toggle { display: inline-block; appearance: none; background: none; background-color: transparent; border: none;
    box-shadow: none; padding: 0; margin: .1rem 0 0; cursor: pointer; color: var(--brand);
    font-size: .8rem; font-weight: 500; line-height: 1.2; white-space: nowrap; width: auto; height: auto; }
  .cell-toggle:hover { background: none; background-color: transparent; color: var(--brand); text-decoration: underline; }
  td.wrap-clamp { vertical-align: top; }
  /* ---------------- 徽章：药丸 + 柔和低饱和 ---------------- */
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .8rem; font-weight: 600; letter-spacing: .01em; }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .badge.err { background: var(--err-bg); color: var(--err-fg); }
  .badge.off { background: var(--off-bg); color: var(--off-fg); }
  table td, table th { vertical-align: middle; }
  .mono { font-family: ui-monospace, monospace; font-size: .9em; }
  .row-actions { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  .row-actions button, .row-actions a[role=button] { padding: .4rem .6rem; font-size: .85rem; margin: 0; white-space: nowrap; width: auto; }
  td .row-actions { flex-wrap: nowrap; }
  .muted { color: var(--pico-muted-color); }
  .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
  /* ---------------- 提示条 note ---------------- */
  .note { padding: .6rem .9rem; border-radius: var(--radius-sm); margin: .5rem 0; border: 1px solid transparent; }
  .note.ok { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok-fg) 25%, transparent); }
  .note.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn-fg) 25%, transparent); }
  .note.err { background: var(--err-bg); border-color: color-mix(in srgb, var(--err-fg) 25%, transparent); }
  .note.info { background: var(--info-bg); border-color: color-mix(in srgb, var(--info-fg) 25%, transparent); }
  #toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: .5rem 1.2rem; border-radius: 999px; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99; }
  form.inline { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: .5rem; align-items: end; }
  form.inline label { margin: 0; font-size: .85rem; }
  @media (max-width: 800px) { form.inline { grid-template-columns: 1fr; } }
  /* Bulletin board. */
  .bulletin-item { border-left: 4px solid var(--pico-muted-border-color); padding: .6rem .8rem; margin-bottom: .5rem; border-radius: .3rem; background: var(--pico-card-background-color); }
  .bulletin-item.bull-info { border-left-color: var(--brand); }
  .bulletin-item.bull-warn { border-left-color: var(--warn-fg); }
  .bulletin-item.bull-imp { border-left-color: var(--err-fg); }
  .bulletin-item h4 { margin: 0; font-size: 1rem; }
  .bulletin-content img { max-width: 100%; }
  /* ---------------- 表格：表头分层 + 斑马纹 + 悬浮行 ---------------- */
  /* （.table-wrap 容器圆角；结构层保留 横滑 + 窄屏隐藏列 约定） */
  .table-wrap { border-radius: var(--radius-sm); }
  table { border-collapse: separate; border-spacing: 0; }
  table thead th {
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: .78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    border-bottom: 1px solid var(--border-strong);
    padding: .6rem .75rem;
  }
  table tbody tr { transition: background .1s ease; }
  table tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
  table tbody tr:hover { background: var(--brand-soft); }
  /* Pico gives body table cells an opaque page background; make them transparent
     so row-level zebra/hover colors (and full-width empty rows) can show through. */
  table tbody th, table tbody td { background-color: transparent; }
  table td { border-bottom: 1px solid var(--border); }
  /* ---------------- Tab 导航：透明底 + muted 字 + 选中主色下划线 ----------------
     Admin tab navigation.
     Tabs use flex so they fill the bar evenly on wide screens
     （宽屏等宽：basis 0 + grow 1，避免内容长的 tab 更宽、选中加粗再撑宽）。
     Admin has nine tabs and several long English labels. Give them one
     readable equal-width floor; narrower viewports use the existing hidden-
     scrollbar horizontal scroll instead of letting text overlap.
     R1：保留 overflow-x:auto 但隐藏溢出滚动条（scrollbar-width:none +
     ::-webkit-scrollbar{display:none}），内容靠横滑而非竖条。 */
  .tab-nav-shell { position: relative; margin-bottom: 1.25rem; --tab-scroll-w: 1.75rem; }
  .tab-nav { display: flex; gap: .25rem; border-bottom: 2px solid var(--border-strong); margin-bottom: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .tab-nav::-webkit-scrollbar { display: none; }
  /* R2：tab 默认透明底 + muted 字（不被主按钮实心规则盖住）；选中主色
     下划线 + 加粗。 */
  .tab-nav .admin-tab { flex: 1 1 0; min-width: 8.5rem; padding: .5rem .6rem; border: none; border-radius: .35rem .35rem 0 0; background: transparent; box-shadow: none; color: var(--text-muted); cursor: pointer; font-size: .8rem; font-weight: 500; margin-bottom: -2px; border-bottom: 2px solid transparent; white-space: nowrap; transition: color .12s ease, background .12s ease, border-color .12s ease; }
  .tab-nav .admin-tab:hover { color: var(--text); background: color-mix(in srgb, var(--brand-soft) 55%, transparent); }
  .tab-nav .admin-tab.active { color: var(--brand); background: transparent; border-bottom-color: var(--brand); font-weight: 700; }
  /* Dropdown menu for user table actions. Fixed positioning lets it escape
     the table-wrap overflow clip; admin.js keeps it aligned with its trigger. */
  .dropdown-wrapper { position: relative; display: inline-block; }
  .dropdown-menu { display: none; position: fixed; z-index: 100; background: var(--pico-card-background-color); border: 1px solid var(--pico-muted-border-color); border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.2); min-width: 130px; padding: .25rem 0; }
  .dropdown-menu button:hover { background: var(--pico-primary-hover-background); color: var(--pico-primary-inverse); }
  /* User tab navigation. Same look as admin tabs. */
  .tab-nav .user-tab { flex: 1 1 0; min-width: 6rem; padding: .5rem 1rem; border: none; border-radius: .35rem .35rem 0 0; background: transparent; box-shadow: none; color: var(--text-muted); cursor: pointer; font-size: .9rem; font-weight: 500; margin-bottom: -2px; border-bottom: 2px solid transparent; white-space: nowrap; transition: color .12s ease, background .12s ease, border-color .12s ease; }
  .tab-nav .user-tab:hover { color: var(--text); background: color-mix(in srgb, var(--brand-soft) 55%, transparent); }
  .tab-nav .user-tab.active { color: var(--brand); background: transparent; border-bottom-color: var(--brand); font-weight: 700; }
  /* ---- W1b: tab-nav 溢出滚动（方案 A）----
     两站共享 `.tab-nav`。仅当标签行溢出时才显示左右窄按钮 + 边缘渐隐；
     未溢出不预留任何空间。`.tab-scroll` 由 initTabScroll 在 scrollWidth
     超出 clientWidth 时添加；`.tab-scroll-left`/`.tab-scroll-right` 分别
     控制左右按钮/渐隐的显隐，使静止边永远清爽可点。
     溢出时给容器加 padding-inline（=按钮宽）作为 gutter，按钮与渐隐都
     落在 gutter 上、不遮挡任何 tab 的可点击区；tab 滑动时从渐隐下淡出。
     按钮与渐隐均为 position:absolute，不参与 flex 布局。原生触控/触摸板
     横滑与鼠标滚轮完全不拦截（无 wheel/touch 事件、无 touch-action 改动）。 */
  /* The shell owns the fixed edge controls. Keeping them outside the
     scrollable nav prevents absolute children from moving away with
     scrollLeft (the V-ACCEPT mobile matrix caught that failure mode). */
  .tab-nav-shell.tab-scroll { padding-inline: var(--tab-scroll-w); }
  .tab-nav-shell > .tab-scroll-btn {
    display: none; position: absolute; top: 0; bottom: 0; z-index: 3;
    width: var(--tab-scroll-w); padding: 0; border: 0; border-radius: 0;
    background: transparent; box-shadow: none; color: var(--text-muted);
    cursor: pointer; font-size: 1rem; line-height: 1;
    align-items: center; justify-content: center;
  }
  .tab-nav-shell > .tab-scroll-btn:hover { color: var(--brand); background: color-mix(in srgb, var(--brand-soft) 55%, transparent); }
  .tab-nav-shell > .tab-scroll-btn.left { left: 0; }
  .tab-nav-shell > .tab-scroll-btn.right { right: 0; }
  .tab-nav-shell.tab-scroll > .tab-scroll-btn { display: inline-flex; }
  .tab-nav-shell.tab-scroll:not(.tab-scroll-left) > .tab-scroll-btn.left { display: none; }
  .tab-nav-shell.tab-scroll:not(.tab-scroll-right) > .tab-scroll-btn.right { display: none; }
  /* 边缘渐隐遮罩（不可交互）。颜色跟随页面背景令牌，深色主题自动适配。 */
  .tab-nav-shell.tab-scroll::before,
  .tab-nav-shell.tab-scroll::after {
    content: ""; position: absolute; top: 0; bottom: 0; z-index: 2;
    width: var(--tab-scroll-w); pointer-events: none;
  }
  .tab-nav-shell.tab-scroll::before { left: 0; background: linear-gradient(to right, var(--pico-background-color), transparent); }
  .tab-nav-shell.tab-scroll::after { right: 0; background: linear-gradient(to left, var(--pico-background-color), transparent); }
  .tab-nav-shell.tab-scroll:not(.tab-scroll-left)::before { display: none; }
  .tab-nav-shell.tab-scroll:not(.tab-scroll-right)::after { display: none; }
  /* ---------------- 按钮：圆润 + 层次 + 主色实心/描边 ----------------
     主按钮选择器必须排除 tab，否则它们的「无类 button」会被误上实心底，
     盖住 tab 透明背景。 */
  button:not(.secondary):not(.contrast):not(.outline):not(.user-tab):not(.admin-tab):not(.tab-scroll-btn):not(.cell-toggle),
  input[type=submit] {
    background: var(--brand);
    border-color: var(--brand);
    box-shadow: 0 1px 2px rgba(37, 99, 235, .3);
  }
  button:not(.secondary):not(.contrast):not(.outline):not(.user-tab):not(.admin-tab):not(.tab-scroll-btn):not(.cell-toggle):hover,
  input[type=submit]:hover {
    background: var(--brand-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px -2px rgba(37, 99, 235, .4);
  }
  button, [role=button], input[type=submit] {
    font-weight: 600;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  /* 圆角只作用于非 tab 的真实按钮，避免在 tab 上叠出圆角色块。 */
  button:not(.user-tab):not(.admin-tab):not(.tab-scroll-btn):not(.cell-toggle), [role=button], input[type=submit] { border-radius: var(--radius-sm); }
  button.secondary { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
  button.secondary:hover { background: var(--border); }
  /* ---------------- 表单控件：柔和边框 + 聚焦主色环 ---------------- */
  input, select, textarea {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--pico-primary-focus);
    outline: none;
  }
  /* ---------------- 对话框：大圆角 + 深投影 ---------------- */
  dialog { border-radius: var(--radius); box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
  /* ---------------- 链接 / 页脚 ---------------- */
  footer { color: var(--text-muted); }
  a { color: var(--brand); }
  a:hover { color: var(--brand-hover); }
  /* Key + data cards above user tabs: side-by-side on small screens. */
  .user-top-cards { display: flex; flex-wrap: wrap; gap: 1.25rem; }
  .user-top-cards > .card { flex: 1 1 16rem; margin-bottom: 1.25rem; }
  /* R-A: level badge (everyone) + level-2+ banner. Banner is plain text
     with a lightweight CSS gradient shift (GPU-composited background
     position, no canvas / JS loop), not closable. */
  #level-area { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin-bottom: .75rem; }
  .level-badge { display: inline-flex; align-items: center; padding: .15rem .7rem; border-radius: 999px; background: linear-gradient(135deg, var(--brand), var(--brand-hover)); color: var(--pico-primary-inverse); font-size: .85rem; font-weight: 600; line-height: 1.5; box-shadow: 0 2px 6px rgba(37, 99, 235, .35); }
  .level-banner { flex: 1 1 100%; padding: .6rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--brand-border); background: linear-gradient(90deg, var(--brand-soft), color-mix(in srgb, var(--brand-soft) 60%, var(--brand-border)), var(--brand-soft)); background-size: 200% 100%; animation: levelBannerShift 8s linear infinite; font-weight: 600; }
  @keyframes levelBannerShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
  @media (prefers-reduced-motion: reduce) { .level-banner { animation: none; } }

  /* ---------------- 小游戏：池塘垂钓 ---------------- */
  .games-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: .75rem; margin-bottom: 1rem; }
  .games-heading > *, .game-card-title > *, .fishing-layout > *, .games-leaderboard-head > * { min-width: 0; }
  .games-heading h2 { margin: 0 0 .2rem; font-size: 1.45rem; letter-spacing: -.02em; }
  .games-heading p { margin: 0; }
  #games-balance { padding: .35rem .75rem; font-size: .9rem; white-space: nowrap; }
  .games-list, .fishing-game-body { min-width: 0; }
  .game-card { overflow: hidden; }
  .game-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1rem; }
  .game-card-title { display: flex; align-items: center; gap: .8rem; }
  .game-card-title h3 { margin: 0 0 .2rem; font-size: 1.2rem; }
  .game-card-title p { margin: 0; }
  .game-card-mark { display: inline-grid; place-items: center; flex: 0 0 3rem; width: 3rem; height: 3rem; border-radius: 1rem; color: var(--brand); background: linear-gradient(145deg, var(--brand-soft), color-mix(in srgb, var(--brand-border) 55%, var(--surface))); border: 1px solid var(--brand-border); font-size: 1.65rem; font-weight: 800; }
  .games-entry-btn { width: auto; margin: 0; }
  .games-unavailable { border-style: dashed; }
  .games-empty { margin-bottom: 0; }
  .fishing-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(17rem, .85fr); gap: 1rem; align-items: stretch; }
  .fishing-play-panel, .fishing-result-panel { min-width: 0; }
  .fishing-play-panel h4, .fishing-result-panel h4, .games-leaderboard h4 { margin: 0 0 .75rem; font-size: .95rem; }
  .fishing-baits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; margin-bottom: .8rem; outline: none; }
  .bait-choice { display: flex; flex-direction: column; align-items: flex-start; gap: .12rem; min-width: 0; margin: 0; padding: .7rem .85rem; text-align: left; }
  .bait-choice .bait-name { width: 100%; overflow-wrap: anywhere; font-weight: 750; }
  .bait-choice small { color: var(--text-muted); font-weight: 600; }
  .bait-choice.selected { color: var(--brand); background: var(--brand-soft); border-color: var(--brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 18%, transparent); }
  .bait-choice.selected small { color: var(--brand); }
  /* ---------------- 小游戏场景：方案 C（CSS 水面 + Canvas 粒子） ---------------- */
  .fishing-stage { position: relative; isolation: isolate; width: 100%; height: 14rem; overflow: hidden; border: 1px solid var(--brand-border); border-radius: var(--radius);
    background: linear-gradient(to bottom, #a5dcf2 0 50%, #2f9fb0 50% 82%, #2386a0 100%); }
  [data-theme="dark"] .fishing-stage { background: linear-gradient(to bottom, #102540 0 50%, #0e3648 50% 82%, #0a2b3a 100%); }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) .fishing-stage { background: linear-gradient(to bottom, #102540 0 50%, #0e3648 50% 82%, #0a2b3a 100%); }
  }
  .fishing-stage::before, .fishing-stage::after { content: ""; position: absolute; z-index: 2; left: -8%; width: 116%; height: 1px; top: 61%; background: color-mix(in srgb, #fff 50%, transparent); box-shadow: 0 1.25rem 0 color-mix(in srgb, #fff 27%, transparent), 0 2.7rem 0 color-mix(in srgb, #fff 18%, transparent); transform: rotate(-1deg); }
  .fishing-stage::after { top: 68%; left: -14%; transform: rotate(1.5deg); opacity: .7; }
  .fishing-cloud { position: absolute; z-index: 3; width: 3.2rem; height: .8rem; border-radius: 999px; background: color-mix(in srgb, var(--surface) 82%, transparent); box-shadow: 1rem -.45rem 0 -.1rem color-mix(in srgb, var(--surface) 82%, transparent), 1.9rem .05rem 0 -.15rem color-mix(in srgb, var(--surface) 82%, transparent); animation: fishingCloud 12s ease-in-out infinite alternate; }
  .cloud-one { top: 18%; left: 18%; }
  .cloud-two { top: 29%; right: 26%; transform: scale(.72); animation-delay: -5s; }
  .fishing-celestial { position: absolute; z-index: 1; right: 14%; top: 8%; width: 2.8rem; height: 2.8rem; border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #fff8d8 0 25%, #ffe28d 54%, #f6bd58 100%); box-shadow: 0 0 0 .55rem rgba(255,224,138,.2), 0 0 2rem .65rem rgba(255,224,138,.42); transition: background .2s ease, box-shadow .2s ease; }
  [data-theme="dark"] .fishing-celestial { background: #e3e8ee; box-shadow: 0 0 0 .3rem rgba(214,226,242,.08), 0 0 1.35rem .35rem rgba(190,213,239,.22); }
  [data-theme="dark"] .fishing-celestial::before, [data-theme="dark"] .fishing-celestial::after { content: ""; position: absolute; border-radius: 50%; background: rgba(125,143,165,.28); }
  [data-theme="dark"] .fishing-celestial::before { width: .45rem; height: .3rem; left: .55rem; top: .65rem; box-shadow: .9rem .55rem 0 .06rem rgba(125,143,165,.22); }
  [data-theme="dark"] .fishing-celestial::after { width: .28rem; height: .28rem; left: 1.45rem; top: 1.55rem; }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) .fishing-celestial { background: #e3e8ee; box-shadow: 0 0 0 .3rem rgba(214,226,242,.08), 0 0 1.35rem .35rem rgba(190,213,239,.22); }
    html:not([data-theme]) .fishing-celestial::before, html:not([data-theme]) .fishing-celestial::after { content: ""; position: absolute; border-radius: 50%; background: rgba(125,143,165,.28); }
    html:not([data-theme]) .fishing-celestial::before { width: .45rem; height: .3rem; left: .55rem; top: .65rem; box-shadow: .9rem .55rem 0 .06rem rgba(125,143,165,.22); }
    html:not([data-theme]) .fishing-celestial::after { width: .28rem; height: .28rem; left: 1.45rem; top: 1.55rem; }
  }
  .fishing-particles { position: absolute; inset: 0; z-index: 4; width: 100%; height: 100%; pointer-events: none; }
  .fishing-bank { position: absolute; z-index: 3; left: -4%; bottom: 44%; width: 45%; height: 2.1rem; border-radius: 50% 70% 22% 0; background: linear-gradient(to bottom, #7fb069, #557e46); transform: rotate(3deg); }
  [data-theme="dark"] .fishing-bank { background: linear-gradient(to bottom, #3d5c33, #2a4423); }
  @media (prefers-color-scheme: dark) { html:not([data-theme]) .fishing-bank { background: linear-gradient(to bottom, #3d5c33, #2a4423); } }

  /* 统一钓组：鱼线挂在竿尖，鱼钩/子线/鱼挂在鱼线底端。 */
  .fishing-rig { position: absolute; inset: 0; z-index: 7; pointer-events: none; overflow: visible; }
  .fishing-rod { position: absolute; left: 11%; top: 43%; width: 39%; height: 4px; border-radius: 999px; background: linear-gradient(to right, #7c4a2c 0 32%, #343b4c 32% 100%); transform: rotate(-12deg); transform-origin: left center; }
  .fishing-rod::before { content: ""; position: absolute; left: -.15rem; top: -.2rem; width: 1rem; height: .45rem; border-radius: 999px; background: #7c4a2c; }
  .fishing-line { position: absolute; left: 100%; top: 50%; width: 1.5px; height: 7rem; background: color-mix(in srgb, var(--text) 62%, transparent); transform-origin: top center; }
  .fishing-float { position: absolute; left: 50%; top: calc(100% - .15rem); width: .45rem; height: 1rem; transform: translateX(-50%); border-radius: 999px; background: linear-gradient(to bottom, #ef4444 0 45%, #fff 45% 72%, #283548 72%); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .fishing-catch { position: absolute; left: 50%; top: calc(100% + .45rem); width: 5rem; height: 3.5rem; transform: translateX(-50%); transform-origin: top center; }
  .fishing-hook { position: absolute; z-index: 3; left: 50%; top: -.45rem; width: .6rem; height: .72rem; transform: translateX(-50%); border-right: 1.5px solid color-mix(in srgb, var(--text) 75%, transparent); border-bottom: 1.5px solid color-mix(in srgb, var(--text) 75%, transparent); border-radius: 0 0 .6rem 0; }
  .fishing-leash { position: absolute; z-index: 2; left: 50%; top: .15rem; width: 1px; height: 1rem; background: color-mix(in srgb, var(--text) 55%, transparent); }
  .fishing-fish { position: absolute; z-index: 1; left: 50%; top: 1.05rem; width: 3.3rem; height: 1rem; transform: translateX(-50%) rotate(-7deg); transform-origin: center; border-radius: 60% 45% 55% 45%; background: rgba(10,60,80,.46); opacity: .58; }
  .fishing-fish::before { content: ""; position: absolute; left: .55rem; top: .25rem; width: .18rem; height: .18rem; border-radius: 50%; background: rgba(255,255,255,.55); }
  .fishing-fish::after { content: ""; position: absolute; right: -.8rem; top: .12rem; border-left: .95rem solid rgba(10,60,80,.46); border-top: .4rem solid transparent; border-bottom: .4rem solid transparent; }
  .phase-casting .fishing-rod { animation: fishingRodCast .75s cubic-bezier(.2,.75,.25,1) both; }
  .phase-casting .fishing-line { animation: fishingLineCast .75s cubic-bezier(.2,.75,.25,1) both; }
  .phase-casting .fishing-fish, .phase-casting .fishing-leash { visibility: hidden; }
  .phase-waiting .fishing-float { animation: fishingBob .68s ease-in-out infinite alternate; }
  .phase-waiting .fishing-fish { animation: fishingApproach 1.1s ease-in-out infinite alternate; }
  .phase-reeling .fishing-rod { animation: fishingRodReel .7s ease-in both; }
  .phase-reeling .fishing-line { animation: fishingLineReel .7s ease-in both; }
  .phase-reeling .fishing-fish { animation: fishingFishTug .7s ease-in-out infinite alternate; }
  .fishing-ripple { position: absolute; z-index: 5; left: 44%; top: 69%; width: 2.5rem; height: .65rem; border: 2px solid color-mix(in srgb, #fff 58%, transparent); border-radius: 50%; opacity: .45; animation: fishingRipple 2.2s ease-out infinite; }
  .ripple-two { animation-delay: -1.1s; }
  .phase-result .fishing-ripple { animation-duration: 1s; }
  @keyframes fishingCloud { from { translate: -1rem 0; } to { translate: 1.25rem .15rem; } }
  @keyframes fishingRipple { 0% { scale: .45; opacity: .6; } 100% { scale: 1.45; opacity: 0; } }
  @keyframes fishingRodCast { 0% { transform: rotate(-54deg); } 55% { transform: rotate(-3deg); } 100% { transform: rotate(-12deg); } }
  @keyframes fishingLineCast { from { height: .15rem; } to { height: 7rem; } }
  @keyframes fishingBob { from { transform: translateX(-50%) translateY(-.15rem) rotate(-2deg); } to { transform: translateX(-50%) translateY(.28rem) rotate(3deg); } }
  @keyframes fishingApproach { from { transform: translateX(calc(-50% + 1.1rem)) rotate(-7deg); opacity: .25; } to { transform: translateX(-50%) rotate(-7deg); opacity: .7; } }
  @keyframes fishingRodReel { 0% { transform: rotate(-12deg); } 60% { transform: rotate(-28deg); } 100% { transform: rotate(-22deg); } }
  @keyframes fishingLineReel { from { height: 7rem; } to { height: 1.2rem; } }
  @keyframes fishingFishTug { from { transform: translateX(-50%) rotate(-12deg); } to { transform: translateX(-50%) rotate(12deg); } }
  .fishing-cast-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .75rem; align-items: center; margin-top: .8rem; }
  #fishing-cast { width: auto; min-width: 8.5rem; margin: 0; }
  #fishing-status { margin: 0; overflow-wrap: anywhere; }
  .game-error-text { color: var(--err-fg); font-weight: 600; }
  .fishing-result-panel { min-height: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius); background: linear-gradient(155deg, var(--surface-2), var(--surface)); overflow-wrap: anywhere; }
  .game-catch { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .8rem; align-items: center; padding: 1rem; border: 1px solid var(--brand-border); border-radius: var(--radius); background: var(--brand-soft); box-shadow: var(--shadow-sm); }
  .game-catch.treasure { border-color: color-mix(in srgb, var(--warn-fg) 58%, var(--border)); background: linear-gradient(145deg, color-mix(in srgb, var(--warn-bg) 88%, var(--surface)), color-mix(in srgb, #facc15 18%, var(--surface))); box-shadow: 0 8px 24px -12px color-mix(in srgb, var(--warn-fg) 55%, transparent); }
  .game-catch.junk { border-color: var(--border-strong); background: var(--surface-2); }
  .catch-glyph { display: inline-grid; place-items: center; width: 3.1rem; height: 3.1rem; border-radius: 50%; color: var(--brand); background: var(--surface); border: 1px solid var(--brand-border); font-size: 1.55rem; font-weight: 800; }
  .treasure .catch-glyph { color: var(--warn-fg); border-color: color-mix(in srgb, var(--warn-fg) 48%, var(--border)); box-shadow: 0 0 0 5px color-mix(in srgb, var(--warn-fg) 12%, transparent); }
  .junk .catch-glyph { color: var(--off-fg); border-color: var(--border-strong); }
  .catch-name { font-size: 1.22rem; font-weight: 800; letter-spacing: -.015em; }
  .catch-size { color: var(--brand); white-space: nowrap; }
  .catch-badges { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
  .game-tier.tier-small { background: var(--off-bg); color: var(--off-fg); }
  .game-tier.tier-regular { background: var(--ok-bg); color: var(--ok-fg); }
  .game-tier.tier-big { background: var(--info-bg); color: var(--info-fg); }
  .game-tier.tier-giant { background: var(--warn-bg); color: var(--warn-fg); }
  .game-tier.tier-legend { background: var(--err-bg); color: var(--err-fg); }
  .game-meter { background: linear-gradient(135deg, var(--brand), var(--brand-hover)); color: #fff; }
  .catch-special, .game-reward, .game-balance-result { grid-column: 1 / -1; margin: 0; }
  .catch-special { padding-top: .6rem; border-top: 1px solid color-mix(in srgb, currentColor 13%, transparent); }
  .game-reward { color: var(--ok-fg); font-size: 1.05rem; }
  .games-leaderboard { min-width: 0; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .games-leaderboard-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: .75rem 1rem; margin-bottom: .8rem; }
  .games-board-switch button { width: auto; }
  .games-board-btn.active { color: var(--brand); background: var(--brand-soft); border-color: var(--brand); box-shadow: inset 0 -2px 0 var(--brand); }
  .games-anon-control { display: flex; align-items: center; gap: .55rem; width: auto; margin: 0; font-size: .9rem; font-weight: 600; }
  .games-anon-control input { flex: 0 0 auto; margin: 0; }
  .game-lb-me { background: var(--brand-soft) !important; }
  .game-lb-me td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
  .game-my-rank { margin-left: .35rem; color: var(--brand); background: color-mix(in srgb, var(--brand) 13%, transparent); }
  .game-lb-species { font-weight: 600; }
  @media (max-width: 768px) {
    .fishing-layout { grid-template-columns: 1fr; }
    .fishing-stage { height: 12.5rem; }
    .fishing-result-panel { min-height: 10rem; }
    .games-leaderboard-head { align-items: stretch; }
    .games-anon-control { width: 100%; }
  }
  @media (max-width: 480px) {
    .games-heading h2 { font-size: 1.25rem; }
    .game-card-mark { flex-basis: 2.6rem; width: 2.6rem; height: 2.6rem; }
    .fishing-baits { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fishing-cast-row { grid-template-columns: 1fr; }
    #fishing-cast { width: 100%; }
    .fishing-stage { height: 11.5rem; }
    .catch-name { font-size: 1.08rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fishing-cloud, .fishing-ripple, .fishing-rod, .fishing-line,
    .fishing-float, .fishing-fish { animation: none !important; }
  }

  /* Admin logs filter grid layout — 3 rows. */
  #admin-logs-filter { display: grid; grid-template-columns: 1fr 1fr auto; gap: .5rem .75rem; align-items: center; }
  #admin-logs-filter label { margin-bottom: 0; }
  #admin-logs-filter input, #admin-logs-filter select { margin-bottom: 0; }
  #admin-logs-filter button { margin-bottom: 0; }
  #admin-logs-filter .afl-user   { grid-column: 1; grid-row: 1; }
  #admin-logs-filter .afl-status { grid-column: 2; grid-row: 1; }
  #admin-logs-filter .afl-svc    { grid-column: 1; grid-row: 2; }
  #admin-logs-filter .afl-model  { grid-column: 2; grid-row: 2; }
  #admin-logs-filter .afl-since  { grid-column: 1; grid-row: 3; }
  #admin-logs-filter .afl-until  { grid-column: 2; grid-row: 3; }
  #admin-logs-filter .afl-actions { grid-column: 3; grid-row: 1 / 4; align-self: center; display: flex; flex-direction: column; gap: .5rem; }
  #admin-logs-filter .afl-actions button { width: auto; margin: 0; }
  /* User-site all-logs filter has no user field: fill the grid without the hole. */
  #admin-logs-filter.alf-no-user .afl-svc    { grid-column: 1; grid-row: 1; }
  #admin-logs-filter.alf-no-user .afl-status { grid-column: 2; grid-row: 1; }
  #admin-logs-filter.alf-no-user .afl-model  { grid-column: 1; grid-row: 2; }
  #admin-logs-filter.alf-no-user .afl-since  { grid-column: 2; grid-row: 2; }
  #admin-logs-filter.alf-no-user .afl-until  { grid-column: 1; grid-row: 3; }
  #admin-logs-filter.alf-no-user .afl-actions { grid-column: 2; grid-row: 3; flex-direction: row; }
  /* Admin donation filter: 2×2 grid on wide screens, single column on narrow
     (media query below). Labels share a uniform width inside their cells. */
  #don-filter { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .75rem; align-items: end; margin-bottom: .75rem; }
  #don-filter label { margin-bottom: 0; }
  #don-filter input, #don-filter select { width: 100%; margin-bottom: 0; }
  .admin-log-chart { position: relative; height: 18rem; padding: .5rem; border: 1px solid var(--pico-muted-border-color); border-radius: 4px; }
  .activity-heading, .activity-chart-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; }
  .activity-heading h3, .activity-heading p, .activity-chart-toolbar h4, .activity-chart-toolbar label { margin-bottom: 0; }
  /* ---------------- 共享 KPI 卡（W1d）：大数字 + 标签 + 趋势 ----------------
     供活跃度、小游戏等模块复用；基于设计令牌，深色主题自动适配。
     .activity-summary-cards 是活跃度网格（保留旧类名），与 .kpi-grid 同规则。 */
  .kpi-grid, .activity-summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem; margin: 1rem 0; }
  .kpi-card { margin: 0; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); transition: box-shadow .18s ease, transform .18s ease; }
  .kpi-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .kpi-label { display: block; color: var(--text-muted); font-size: .82rem; font-weight: 600; letter-spacing: .01em; }
  .kpi-value { display: block; font-size: 1.9rem; line-height: 1.3; margin: .2rem 0; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
  .kpi-sub { display: block; color: var(--text-muted); font-size: .78rem; }
  .kpi-trend { display: inline-block; font-size: .8rem; font-weight: 700; }
  .kpi-trend.up { color: var(--ok-fg); }
  .kpi-trend.down { color: var(--err-fg); }
  .kpi-trend.flat { color: var(--text-muted); }
  /* The activation card carries a textual fallback ("Unavailable") plus a hint.
     Keep that value on one line without shrinking the ordinary numeric KPIs. */
  @media (min-width: 769px) {
    .kpi-card:has(> .kpi-sub) { padding-inline: .5rem; }
    .kpi-card:has(> .kpi-sub) .kpi-value { font-size: 1.55rem; overflow-wrap: normal; white-space: nowrap; }
  }
  .activity-chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin: .75rem 0 1rem; }
  .activity-chart { position: relative; min-width: 0; height: 20rem; padding: .5rem; border: 1px solid var(--pico-muted-border-color); border-radius: 4px; }
  .activity-ranges button[aria-pressed="true"] { font-weight: 700; }
  /* ---------------- 共享：空状态 / 骨架屏 / 登录卡（W1d）---------------- */
  /* 空状态：表格空数据行 + 面板空区块，居中友好文案（插画不做）。 */
  .empty-state { text-align: center; color: var(--text-muted); }
  td.empty-state { padding: 1.75rem .5rem; }
  p.empty-state { padding: 1rem 0; }
  /* 骨架屏：shimmer 占位条；prefers-reduced-motion 时静态。仅用于页面级加载区。 */
  .skeleton { position: relative; overflow: hidden; background: var(--surface-2); border-radius: var(--radius-sm); }
  .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--border-strong) 65%, transparent), transparent); animation: skeletonShimmer 1.4s ease-in-out infinite; }
  @keyframes skeletonShimmer { 100% { transform: translateX(100%); } }
  .skeleton-line { height: .9rem; margin: .4rem 0; }
  .skeleton-line.short { width: 45%; }
  .skeleton-line.mid { width: 70%; }
  .skel-card { padding: 1.25rem; max-width: 36rem; }
  @media (prefers-reduced-motion: reduce) { .skeleton::after { animation: none; opacity: .55; } }
  /* 登录卡：品牌化居中（组件级宽度保持现状，V-ACCEPT 再定）。 */
  .login-card { text-align: center; }
  .login-card h3 { color: var(--brand); font-size: 1.3rem; letter-spacing: -.01em; }
  .login-card form { text-align: left; }
  .login-card .note { text-align: left; }
  .login-mark { display: inline-grid; place-items: center; width: 3rem; height: 3rem; margin: 0 auto .75rem; border-radius: 1rem; color: var(--brand); background: linear-gradient(145deg, var(--brand-soft), color-mix(in srgb, var(--brand-border) 55%, var(--surface))); border: 1px solid var(--brand-border); }
  .login-mark::before { content: ""; width: 1.1rem; height: 1.1rem; border-radius: .35rem; background: var(--brand); opacity: .85; }
  /* 信息层级：卡片小标题间距微调（保守，不重构布局）。 */
  .card h4 { margin: 1rem 0 .5rem; font-size: .95rem; }
  @media (max-width: 800px) {
    #admin-logs-filter { grid-template-columns: 1fr; }
    /* Reset every explicit desktop grid position; otherwise column 2 remains
       implicit and pushes the admin log page wider than the phone viewport. */
    #admin-logs-filter .afl-user, #admin-logs-filter .afl-status,
    #admin-logs-filter .afl-svc, #admin-logs-filter .afl-model,
    #admin-logs-filter .afl-since, #admin-logs-filter .afl-until { grid-column: 1; grid-row: auto; }
    #admin-logs-filter .afl-actions { grid-column: 1; grid-row: auto; flex-direction: row; }
    /* The alf-no-user placement rules above must collapse too. */
    #admin-logs-filter.alf-no-user .afl-svc, #admin-logs-filter.alf-no-user .afl-status,
    #admin-logs-filter.alf-no-user .afl-model, #admin-logs-filter.alf-no-user .afl-since,
    #admin-logs-filter.alf-no-user .afl-until, #admin-logs-filter.alf-no-user .afl-actions { grid-column: 1; grid-row: auto; }
    #don-filter { grid-template-columns: 1fr; }
    .activity-chart-grid { grid-template-columns: 1fr; }
  }
  /* ---- Mobile / tablet adaptation ----
     Two breakpoints: 768px (tablet/phone) and 480px (small phone).
     Wide-screen behavior is untouched — all rules are inside @media. */
  @media (max-width: 768px) {
    main.container { width: 100%; padding: .5rem; }
    .admin-log-chart { height: 16rem; padding: .25rem; }
    .activity-chart { height: 16rem; padding: .25rem; }
    .activity-summary-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card { padding: .9rem .9rem; }
    body > nav { flex-wrap: wrap; gap: .5rem; padding: .5rem .75rem; }
    /* 窄屏 tab 改自然宽度 + 隐藏式横向滑动（tab 多时可滚），字不再被压缩折行。 */
    .tab-nav .admin-tab, .tab-nav .user-tab { flex: 0 0 auto; min-width: 0; padding: .45rem .8rem; font-size: .8rem; }
    .kpi-card { padding: .7rem .9rem; }
    .kpi-card .kpi-value { font-size: 1.55rem; }
    /* Full-screen dialogs so they stay usable & closable on phones. */
    dialog { max-width: 100vw; max-height: 100vh; width: 100%; margin: 0; border-radius: 0; }
    dialog article { max-height: calc(100vh - 2rem); overflow-y: auto; padding: 1rem; }
    .user-top-cards > .card { flex: 1 1 100%; }
    .dropdown-menu { max-width: 90vw; }
    #toast { max-width: 90vw; white-space: normal; text-align: center; }
  }
  @media (max-width: 480px) {
    .admin-log-chart { height: 14rem; }
    .activity-chart { height: 14rem; }
    .activity-summary-cards { grid-template-columns: 1fr; }
    .card { padding: .75rem; }
    .card h3 { font-size: 1rem; }
    .kpi-card .kpi-value { font-size: 1.4rem; }
    /* 结构层在 480px 给所有 button 设 44px 触控高度；tab 保持原触控高度即可。 */
    .tab-nav .admin-tab, .tab-nav .user-tab { min-width: auto; padding: .25rem .4rem; font-size: .75rem; }
    .tab-nav-shell { --tab-scroll-w: 1.4rem; }
    body > nav .logo { font-size: .95rem; }
    table td, table th { font-size: .85rem; padding: .4rem .5rem; }
    /* Apple HIG 44px touch target on small screens. Checkboxes/radios/switches
       are excluded: they have intrinsic sizing and forcing 44px would distort
       their glyphs and inflate table rows without aiding touch. */
    button, [role=button], select, textarea,
    input:not([type=checkbox]):not([type=radio]) { min-height: 44px; }
    /* Hide secondary columns on narrow screens. nth-child indices couple to
       column order — see AGENTS.md §4 #5; update if a table's columns change.
       Scoped via :has(tbody#id) / container id so only the intended table is
       affected. :has() is supported in all modern browsers (2022+). */
    /* admin user table: RPM (col 7 — leading checkbox is col 1, level col 4) */
    table:has(tbody#user-rows) th:nth-child(7),
    table:has(tbody#user-rows) td:nth-child(7) { display: none; }
    /* admin request-log table: error code + error detail (col 8 & 9) */
    table:has(tbody#alf-rows) th:nth-child(8),
    table:has(tbody#alf-rows) td:nth-child(8),
    table:has(tbody#alf-rows) th:nth-child(9),
    table:has(tbody#alf-rows) td:nth-child(9) { display: none; }
    /* admin donation table: RPM limit (col 8) + note (col 10) */
    table:has(tbody#don-rows) th:nth-child(8),
    table:has(tbody#don-rows) td:nth-child(8),
    table:has(tbody#don-rows) th:nth-child(10),
    table:has(tbody#don-rows) td:nth-child(10) { display: none; }
    /* admin application-history table: note (col 5) + admin review note (col 6) */
    #donation-app-history-content th:nth-child(5),
    #donation-app-history-content td:nth-child(5),
    #donation-app-history-content th:nth-child(6),
    #donation-app-history-content td:nth-child(6) { display: none; }
  }
</style>
</head>

</footer>
